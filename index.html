<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scrapper</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <main class="container">
        <h1>Job Scrapper</h1>
        <h4>What Job Do You Want?</h4>
        <form onsubmit="event.preventDefault(); window.location.href='search/' + this.keyword.value + '/'">
            <input type="text" name="keyword" placeholder="write on keyword please" required />
            <button>Search</button>
        </form>
    </main>
</body>
</html>
